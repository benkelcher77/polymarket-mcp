[project]
name = "polymarket-mcp"
version = "0.1.0"
description = "MCP server exposing Polymarket prediction markets as context for LLMs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.26.0",
]

[project.scripts]
polymarket-mcp = "polymarket_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polymarket_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
